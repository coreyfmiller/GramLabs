name: Fetch YouTube Reviews (DISABLED — bad matching logic, use /admin/videos instead)

on:
  # DISABLED: This workflow matched videos too loosely (brand-only, not exact product).
  # Videos are now manually approved via the admin enrichment dashboard.
  # To re-enable, fix the matching logic in fetch-youtube-reviews.mjs to require
  # exact product name in video title before assigning.
  #
  # schedule:
  #   - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI (for testing fixes only)

jobs:
  fetch-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch YouTube reviews
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/fetch-youtube-reviews.mjs

      - name: Check if coverage is complete
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "If the script reports 'All searchable items processed', coverage is complete."
          echo "This workflow will keep running monthly after initial population to catch new items."
